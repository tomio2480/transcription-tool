[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-tool"
version = "0.1.0"
description = "ffmpeg と whisper.cpp による録音音声の文字起こし CLI（複数リポジトリから共用する）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/tomio2480/transcription-tool"
Issues = "https://github.com/tomio2480/transcription-tool/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transcribe-audio = "transcription_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
